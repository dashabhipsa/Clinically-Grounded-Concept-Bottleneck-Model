# Spatially Grounded CBM on the ChestX-Det subset.
# Uses Strategy-B boxes (label-map connected components) as grounding
# supervision. Loaded together with configs/chestxdet_base.yaml.

experiment: spatial_cbm

model:
  encoder: densenet121
  pretrained: true
  concept_activation: sigmoid
  concept_pool: avg
  grounding:
    weight: 0.5
    background_weight: 0.0
    mask_smoothing_sigma: 0.0
    box_corruption: correct

data:
  augment: false

training:
  lambda_concept: 1.0
  lambda_diagnosis: 1.0

evaluation:
  cam_threshold: 0.5
