# Spatial-supervision corruption: SHIFTED boxes (training-time supervision is
# randomly translated by +/-0.2 normalized units per axis). Deterministic via
# the run seed. Loaded together with configs/base.yaml (base first, then this).

experiment: spatial_cbm

model:
  encoder: densenet121
  pretrained: true
  concept_activation: sigmoid
  concept_pool: avg
  grounding:
    weight: 0.5
    background_weight: 0.0
    mask_smoothing_sigma: 0.0
    box_corruption: shifted

data:
  augment: false

training:
  epochs: 30
  learning_rate: 0.0001
  weight_decay: 0.0001
  patience: 5
  lambda_concept: 1.0
  lambda_diagnosis: 1.0
