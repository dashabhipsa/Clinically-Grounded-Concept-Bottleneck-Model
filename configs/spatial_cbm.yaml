# Spatially Grounded Concept Bottleneck Model experiment (Phase 2).
# Loaded together with base.yaml (base first, then this file).
#
#   Chest X-ray -> DenseNet-121 -> spatial feature map
#                -> concept-specific spatial heads -> concept activation maps
#                -> concept scores -> concept bottleneck z -> diagnosis
#
# There is NO direct encoder -> diagnosis connection.

experiment: spatial_cbm

model:
  encoder: densenet121
  pretrained: true
  concept_activation: sigmoid
  # How each concept activation map is pooled into the concept score:
  # "avg" (energy-based) or "max".
  concept_pool: avg
  grounding:
    # Weight of the soft spatial-grounding loss (1 - ELS). Ablations use
    # 0.0 / 0.1 / 0.25 / 0.5 / 1.0.
    weight: 0.5
    # Optional penalty pushing total energy of box-less concepts to zero.
    background_weight: 0.0
    # Optional Gaussian smoothing of the box masks -> soft grounding targets.
    mask_smoothing_sigma: 0.0
    # Corruption of the *training-time box supervision*: correct | shifted |
    # random | none. Kept deterministic via the run seed.
    box_corruption: correct

data:
  # Masks are derived from normalized boxes; flips/affine augmentations would
  # break the box <-> activation alignment, so geometry-free training is used.
  augment: false

training:
  epochs: 30
  learning_rate: 0.0001
  weight_decay: 0.0001
  patience: 5
  lambda_concept: 1.0
  lambda_diagnosis: 1.0

evaluation:
  threshold: 0.5
  # CAM threshold used to derive the predicted box for IoU.
  cam_threshold: 0.5
  iou_threshold: 0.5
